# GP viewer server v0.3: where it listens, which datasets it searches, what the storage browser shows,
# how alphaTab reads files.
# Read by src/grip/apps/gp_viewer/server.py. Paths are relative to the repo root unless they start with ~ or /.
# v0.2: one dataset → a list of datasets (DadaGP, GOAT, ProgGP), each with its own folder and manifests.
# v0.3: storage browser (storage_root + browser section) replaces the flat runs folder; catalogue view; junk flags.
version: "0.3"

server:
  # Localhost only; VS Code Remote-SSH forwards the port to the desktop browser
  host: 127.0.0.1
  port: 8765

# One entry per dataset; keys match the manifests' `dataset` column. Short paths in the path box are
# looked up under these roots (read only). Song-level columns are joined onto the track list on `path`.
datasets:
  dadagp:
    label: DadaGP
    root: ~/storage/grip/datasets/dadagp/DadaGP-v1.1
    tracks_manifest: manifests/dadagp_tracks.parquet
    songs_manifest: manifests/dadagp_songs.parquet
  goat:
    label: GOAT
    root: ~/storage/grip/datasets/goat/GOAT/data
    tracks_manifest: manifests/goat_tracks.parquet
    songs_manifest: manifests/goat_songs.parquet
  proggp:
    label: ProgGP
    root: ~/storage/grip/datasets/proggp/ProgGP/GP5
    tracks_manifest: manifests/proggp_tracks.parquet
    songs_manifest: manifests/proggp_songs.parquet

paths:
  # The storage browser shows this folder as on disk; GP and run files anywhere under it open (read only).
  # Every result lands here: the repo's data/ folders are links into it.
  storage_root: ~/storage/grip
  # The run config the Run button uses (guitar, cost knobs, search settings, runs folder)
  optimiser_run_config: configs/optimiser/optimiser_run_v1.1.yaml
  # Reference passages saved from annotate mode (src/grip/calibration/reference_set.py); off git
  reference_set_folder: ~/storage/grip/calibration/reference_set
  # Junk flags set while browsing (corpus clean-up): one JSON file, off git (it names dataset songs)
  flags_file: ~/storage/grip/flags/track_flags.json
  # alphaTab's browser build, notation font and soundfont (installed by `uv run npm ci`)
  alphatab_dist: node_modules/@coderline/alphatab/dist

alphatab:
  # gp3–5 do not record the alphabet; alphaTab's utf-8 default turns non-Latin track names into "�"
  text_encoding: windows-1252
  # Playback soundfont, relative to alphatab_dist; ships with the npm package
  soundfont: soundfont/sonivox.sf2

browse_list:
  # Rows per page of the song / track list (previous / next / jump to page browse the rest)
  page_size: 100

browser:
  # The storage folder is walked again when the last walk is older than this (a walk takes ~0.15 s)
  index_max_age_seconds: 5
  # How many of the newest files the "recent" list shows
  recent_count: 30
  # Files never shown: DadaGP's token re-saves (PROJECT.md gotcha: read the original gp3/gp4/gp5)
  hidden_name_endings: [.gp2tokens2gp.gp5]

catalogue:
  # Interval paths per page in the catalogue view's list
  path_page_size: 200
  # Places an entry turns up, per page
  occurrence_page_size: 50
  # Catalogue builds kept open at once (each holds its entry table in memory)
  builds_kept_open: 3
  # Tempo an occurrence plays at in the catalogue player (the catalogue tables keep no tempo)
  player_tempo_bpm: 100

gp_files:
  # Extensions the file endpoint will serve
  allowed_extensions: [.gp3, .gp4, .gp5, .gpx, .gp]
