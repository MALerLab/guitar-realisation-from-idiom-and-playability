# Hand profile: the default player's fretting-hand reach, measured on the fretboard (2026-10-30).
# Picked by the run config's `hand_profile` pointer; read by src/grip/core/hand.py.
# Spans in frets past the lower finger (planted), the other finger toward the body, same string.
# Converted to mm at `scale_length_mm`; the hand model blends them over the neck (see hand.py).
# Fingers: index, middle, ring, pinky. Strings: 1 = thinnest.

# Scale length the fret spans are converted to mm at
scale_length_mm: 648.0

# All 6 finger pairs, lower finger on fret 12: comfy / clean max on string 1 and string 6
high_on_neck:
  lower_finger_fret: 12
  finger_pairs:
    index_middle: {string_1: {comfy: 2, clean_max: 3}, string_6: {comfy: 1, clean_max: 2}}
    index_ring:   {string_1: {comfy: 3, clean_max: 5}, string_6: {comfy: 2, clean_max: 3}}
    index_pinky:  {string_1: {comfy: 4, clean_max: 6}, string_6: {comfy: 3, clean_max: 4}}
    middle_ring:  {string_1: {comfy: 1, clean_max: 2}, string_6: {comfy: 1, clean_max: 2}}
    middle_pinky: {string_1: {comfy: 2, clean_max: 4}, string_6: {comfy: 2, clean_max: 3}}
    ring_pinky:   {string_1: {comfy: 1, clean_max: 2}, string_6: {comfy: 0, clean_max: 1}}  # string 6: no comfy zone

# Index on fret 1 → pinky only (the other pairs weren't measured here; they grow by the same factor)
low_on_neck:
  lower_finger_fret: 1
  finger_pairs:
    index_pinky: {string_1: {comfy: 3, clean_max: 4}, string_6: {comfy: 3, clean_max: 4}}

# No-go zone: high frets on thick strings, where the heel and the thumb get in the way.
# Per string: strain_from = the fret where it starts to strain (the cost climbs from here),
# no_go_from = the fret where it's a no-go (null = never). Unmarked strings are free; a string past
# the thickest marked one borrows its marks (a 7th string borrows string 6).
# Jae's marks (2026-11-10): last comfy fret with the pinky or ring = 19 / 20 / 21 / 22 on strings 6 / 5 / 4 / 3.
# Provisional, for testing: no strain part, every fret above the comfy mark is a no-go.
no_go_zone:
  string_6: {strain_from: 20, no_go_from: 20}
  string_5: {strain_from: 21, no_go_from: 21}
  string_4: {strain_from: 22, no_go_from: 22}
  string_3: {strain_from: 23, no_go_from: 23}
