# Bontempi v0.1: the thesis' final end-to-end settings (ch. 6, p. 94-95; code_import/optimization_settings.txt).
# Read by src/grip/existing_tools/bontempi.py. Names are the model's own symbols (model.mod), kept for cross-reading.

# Highest fret the model may use (frets and hand positions 1 … this)
highest_fret: 24
# Most frets finger h may stretch past its natural spot (h = 2, 3, 4; index finger sits at the hand position)
SP_max: {2: 1, 3: 1, 4: 2}
# Comfortable hand positions: below f_lb or above f_ub costs per fret (DH term)
f_lb: 5
f_ub: 12
# Hard timing rule: ms a hand shift takes per fret moved; a shift longer than the time to the note is infeasible
timePerFret: 20
# Per-term scale (d_*) and weight (alpha_*): PC position change, SC string change, HS hand stretch,
# DH hand outside the comfortable zone, NO open string (the source multiplies NO by d_DH, kept as is)
d_PC: 40
d_SC: 20
d_HS: 20
d_DH: 60
d_NO: 40
alpha_PC: 0.2
alpha_SC: 0.1
alpha_HS: 0.2
alpha_DH: 0.3
alpha_NO: 0.2
# How many fingerings: rank 1 = optimum, later ranks via no-good cuts (GRIP add-on)
alternative_count: 3
# Solver time limit per solve, seconds
time_limit_s: 600
